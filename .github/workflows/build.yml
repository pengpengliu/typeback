name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build app
        run: ARCHS="arm64 x86_64" scripts/build-app.sh

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Typeback.app dist/Typeback.zip
          lipo -info dist/Typeback.app/Contents/MacOS/Typeback

      - uses: actions/upload-artifact@v7
        with:
          name: Typeback
          path: dist/Typeback.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Typeback.zip --title "$GITHUB_REF_NAME" --generate-notes
